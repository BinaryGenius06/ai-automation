<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocChat — AI Support Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"
    onload="katexReady = true;"></script>
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --surface-2: #f7f8fa;
      --border: #e4e7ec;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --accent-dark: #1d4ed8;
      --user-bubble: #1e293b;
      --bot-bubble: #f1f5f9;
      --escalate: #fffbeb;
      --escalate-border: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
      --shadow-lg: 0 20px 48px rgba(0,0,0,0.10), 0 8px 16px rgba(0,0,0,0.06);
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(37,99,235,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(16,185,129,0.04) 0%, transparent 50%);
    }

    .wrapper {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg { width: 18px; height: 18px; fill: white; }

    .brand-name {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .status-badge.active {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #15803d;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: all 0.3s ease;
    }

    .status-badge.active .status-dot {
      background: var(--success);
      box-shadow: 0 0 0 2px rgba(16,185,129,0.2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 2px rgba(16,185,129,0.2); }
      50% { box-shadow: 0 0 0 4px rgba(16,185,129,0.1); }
    }

    .load-panel {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }

    .load-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .load-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .load-input-wrap {
      flex: 1;
      position: relative;
    }

    .load-input-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-muted);
    }

    .load-input {
      width: 100%;
      padding: 10px 12px 10px 34px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'DM Mono', monospace;
      font-size: 12.5px;
      color: var(--text-primary);
      background: var(--surface-2);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .load-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
      background: white;
    }

    .load-input::placeholder { color: var(--text-muted); }

    .btn-load {
      padding: 10px 18px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-load:hover { background: var(--accent-dark); }
    .btn-load:active { transform: scale(0.98); }

    .btn-reset {
      padding: 10px 14px;
      background: transparent;
      color: var(--text-secondary);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-reset:hover {
      background: var(--surface-2);
      border-color: #d1d5db;
      color: var(--text-primary);
    }

    .doc-info {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding: 8px 12px;
      background: var(--accent-light);
      border-radius: 8px;
      border: 1px solid #bfdbfe;
    }

    .doc-info.visible { display: flex; }
    .doc-info svg { width: 14px; height: 14px; color: var(--accent); flex-shrink: 0; }

    .doc-info-text {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
    }

    .doc-chunks {
      margin-left: auto;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      background: white;
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid #bfdbfe;
    }

    .chat-window {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 480px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-row {
      display: flex;
      gap: 10px;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      margin-top: 2px;
    }

    .avatar.bot {
      background: var(--accent-light);
      color: var(--accent);
      border: 1.5px solid #bfdbfe;
    }

    .avatar.user {
      background: var(--user-bubble);
      color: white;
    }

    .bubble {
      max-width: 72%;
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-primary);
    }

    .msg-row.user .bubble {
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg-row.bot .bubble {
      background: var(--bot-bubble);
      border-bottom-left-radius: 4px;
    }

    .msg-row.escalate .bubble {
      background: var(--escalate);
      border: 1.5px solid var(--escalate-border);
      border-bottom-left-radius: 4px;
    }

    .escalate-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      color: #92400e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .system-msg {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 4px 0;
      font-style: italic;
    }

    .thinking-bubble {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 13px 16px;
      background: var(--bot-bubble);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .input-bar {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--surface-2);
    }

    .chat-input {
      flex: 1;
      padding: 11px 16px;
      border: 1.5px solid var(--border);
      border-radius: 24px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: white;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .chat-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
    }

    .chat-input:disabled {
      background: var(--surface-2);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .chat-input::placeholder { color: var(--text-muted); }

    .btn-send {
      width: 42px;
      height: 42px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .btn-send:hover:not(:disabled) { background: var(--accent-dark); }
    .btn-send:active:not(:disabled) { transform: scale(0.94); }
    .btn-send:disabled { background: var(--border); cursor: not-allowed; }
    .btn-send svg { width: 17px; height: 17px; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .empty-icon {
      width: 56px;
      height: 56px;
      background: var(--surface-2);
      border: 1.5px dashed var(--border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg { width: 24px; height: 24px; color: var(--text-muted); }

    .empty-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .empty-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      text-align: center;
      max-width: 260px;
      line-height: 1.6;
    }

    /* KaTeX overrides inside bot bubbles */
    .msg-row.bot .bubble .katex-display {
      margin: 6px 0;
      overflow-x: auto;
    }

    .msg-row.bot .bubble .katex {
      font-size: 1em;
    }
  </style>
</head>
<body>
<div class="wrapper">

  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="brand-name">DocChat</div>
        <div class="brand-tag">AI Support Bot</div>
      </div>
    </div>
    <div class="status-badge" id="statusBadge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">No document loaded</span>
    </div>
  </div>

  <div class="load-panel">
    <div class="load-label">Load Document</div>
    <div class="load-row">
      <div class="load-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <input class="load-input" type="text" id="pdfPath" placeholder="Paste PDF URL (Google Drive, Dropbox, any direct link)" />
      </div>
      <button class="btn-load" onclick="loadDoc()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Load PDF
      </button>
      <button class="btn-reset" onclick="resetBot()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
        Reset
      </button>
    </div>
    <div class="doc-info" id="docInfo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <span class="doc-info-text" id="docName">—</span>
      <span class="doc-chunks" id="docChunks">0 chunks</span>
    </div>
  </div>

  <div class="chat-window">
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        </div>
        <div class="empty-title">No document loaded</div>
        <div class="empty-sub">Load a PDF above and start asking questions about its content.</div>
      </div>
    </div>
    <div class="input-bar">
      <input class="chat-input" type="text" id="userInput" placeholder="Load a PDF to start asking questions..." onkeydown="if(event.key==='Enter') sendMessage()" disabled />
      <button class="btn-send" id="sendBtn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

</div>

<script>
  const API = 'http://127.0.0.1:8000';
  let katexReady = false;

  // Wait for KaTeX to load
  document.addEventListener('DOMContentLoaded', () => {
    const checkKatex = setInterval(() => {
      if (typeof renderMathInElement !== 'undefined') {
        katexReady = true;
        clearInterval(checkKatex);
      }
    }, 100);
  });

  const KATEX_OPTIONS = {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$', right: '$', display: false },
      { left: '\\(', right: '\\)', display: false },
      { left: '\\[', right: '\\]', display: true }
    ],
    throwOnError: false,
    errorColor: '#cc0000'
  };

  function renderLatex(element) {
    if (katexReady && typeof renderMathInElement !== 'undefined') {
      try {
        renderMathInElement(element, KATEX_OPTIONS);
      } catch(e) {
        // silently fail — plain text still shows
      }
    }
  }

  function removeEmpty() {
    const e = document.getElementById('emptyState');
    if (e) e.remove();
  }

  function addMsg(text, type) {
    removeEmpty();
    const msgs = document.getElementById('messages');

    if (type === 'system') {
      const div = document.createElement('div');
      div.className = 'system-msg';
      div.textContent = text;
      msgs.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
      return div;
    }

    const row = document.createElement('div');
    const isEscalate = type === 'escalate';
    row.className = `msg-row ${type === 'user' ? 'user' : isEscalate ? 'escalate bot' : 'bot'}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${type === 'user' ? 'user' : 'bot'}`;
    avatar.textContent = type === 'user' ? 'U' : 'AI';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (isEscalate) {
      const tag = document.createElement('div');
      tag.className = 'escalate-tag';
      tag.innerHTML = '⚠ Escalated';
      bubble.appendChild(tag);
    }

    const txt = document.createElement('span');
    // Use innerHTML for bot messages so KaTeX can parse — textContent for user (safety)
    if (type === 'user') {
      txt.textContent = text;
    } else {
      txt.innerHTML = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        // restore LaTeX delimiters after escaping
        .replace(/\\\(/g, '\\(').replace(/\\\)/g, '\\)')
        .replace(/\\\[/g, '\\[').replace(/\\\]/g, '\\]');
      // Don't escape $ — KaTeX needs them raw
    }

    // For bot messages: set innerHTML directly to preserve $ signs for KaTeX
    if (type !== 'user') {
      bubble.innerHTML = (isEscalate ? bubble.innerHTML : '') +
        `<span>${text}</span>`;
      renderLatex(bubble);
    } else {
      bubble.appendChild(txt);
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    msgs.appendChild(row);
    row.scrollIntoView({ behavior: 'smooth' });
    return row;
  }

  function showThinking() {
    removeEmpty();
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'thinking';

    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = 'AI';

    const bubble = document.createElement('div');
    bubble.className = 'thinking-bubble';
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    row.appendChild(avatar);
    row.appendChild(bubble);
    msgs.appendChild(row);
    row.scrollIntoView({ behavior: 'smooth' });
  }

  function removeThinking() {
    document.getElementById('thinking')?.remove();
  }

  async function loadDoc() {
    const path = document.getElementById('pdfPath').value.trim();
    if (!path) return;

    addMsg(`Loading ${path}...`, 'system');

    try {
      const res = await fetch(`${API}/load`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pdf_url: path }),
      });
      const data = await res.json();

      if (!res.ok) {
        addMsg(`Error: ${data.detail}`, 'system');
        return;
      }

      document.getElementById('statusBadge').classList.add('active');
      document.getElementById('statusDot').style.background = '#10b981';
      document.getElementById('statusText').textContent = 'Document ready';

      document.getElementById('docInfo').classList.add('visible');
      document.getElementById('docName').textContent = path.split('/').pop();
      document.getElementById('docChunks').textContent = `${data.chunks} chunks`;

      document.getElementById('userInput').disabled = false;
      document.getElementById('userInput').placeholder = 'Ask anything about this document...';
      document.getElementById('sendBtn').disabled = false;

      addMsg(`Ready — ${data.chunks} chunks indexed. Ask me anything.`, 'system');
    } catch(e) {
      addMsg('Cannot connect to server. Is uvicorn running?', 'system');
    }
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const msg = input.value.trim();
    if (!msg) return;

    addMsg(msg, 'user');
    input.value = '';
    showThinking();

    try {
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg }),
      });
      const data = await res.json();
      removeThinking();
      addMsg(data.answer, data.escalate ? 'escalate' : 'bot');
    } catch(e) {
      removeThinking();
      addMsg('Server error. Try again.', 'system');
    }
  }

  async function resetBot() {
    await fetch(`${API}/reset`, { method: 'DELETE' });

    document.getElementById('messages').innerHTML = `
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        </div>
        <div class="empty-title">No document loaded</div>
        <div class="empty-sub">Load a PDF above and start asking questions about its content.</div>
      </div>`;

    document.getElementById('statusBadge').classList.remove('active');
    document.getElementById('statusText').textContent = 'No document loaded';
    document.getElementById('docInfo').classList.remove('visible');
    document.getElementById('userInput').disabled = true;
    document.getElementById('userInput').placeholder = 'Load a PDF to start asking questions...';
    document.getElementById('sendBtn').disabled = true;
  }
</script>
</body>
</html>
